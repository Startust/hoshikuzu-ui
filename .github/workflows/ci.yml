name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, Registry, Storybook, Design
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build registry
        run: pnpm build:registry

      - name: Check generated registry is committed
        run: git diff --exit-code registry.json public/r

      - name: Build Storybook
        run: pnpm build:storybook

      # Fails the job on primary findings (exit 2). Advisory findings are
      # listed in the log but never fail the build.
      - name: Impeccable design review
        run: pnpm design:detect

      - name: Upload Pages preview
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hoshikuzu-ui-public
          path: public
          if-no-files-found: error

  consumer-smoke:
    name: shadcn Consumer Smoke
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the registry into a fresh base-nova app and build it
        run: pnpm smoke:consumer
